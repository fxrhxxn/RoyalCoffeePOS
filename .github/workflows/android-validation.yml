name: Android validation
on:
  pull_request:
    branches: [main, develop/pos-improvements]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SQLite migration preservation tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compile Android app and run unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
